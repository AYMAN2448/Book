<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الكتب - مكتبة الكتب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  .copy-container { display: flex; align-items: center; gap: 8px; background: #fff; padding: 8px 12px; border-radius: 8px; direction: ltr; margin: 10px 0; border: 1px solid #ddd; }
  .copy-address { flex: 1; font-family: monospace; font-size: 14px; cursor: pointer; user-select: all; }
  .copy-btn { background: #e94560; color: white; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  .toast-msg { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 16px; border-radius: 30px; z-index: 2000; }
  .info-block { background: #f9f9f9; border-right: 4px solid #e94560; padding: 12px; border-radius: 12px; margin: 10px 0; }
  .info-block h4 { margin-bottom: 8px; color: #e94560; }
</style>
</head>
<body>
<header>
  <h2>مكتبة الكتب</h2>
  <nav>
    <a href="/">الرئيسية</a>
    <a href="/orders.html">طلباتي</a>
  </nav>
</header>

<div class="container">
  <h2>الكتب المتاحة</h2>
  <div class="grid" id="booksGrid"></div>
</div>

<div class="modal" id="payModal">
  <div class="modal-content">
    <h3>اختر طريقة الدفع</h3>
    <select id="payMethod">
      <option value="trx">TRX (تحقق تلقائي)</option>
      <option value="usdt">USDT (تحقق تلقائي)</option>
      <option value="bank">تحويل بنكي / كاشي (يدوي)</option>
    </select>
    <p>المبلغ المطلوب: <span id="bookPrice"></span></p>

    <div id="bankAccountInfo" style="display:none;">
      <div class="info-block">
        <h4>🏦 تحويل بنكي:</h4>
        <p><strong>رقم الحساب:</strong> 1234567890</p>
        <p><strong>اسم صاحب الحساب:</strong> مؤسسة مكتبة الكتب</p>
        <p><strong>تعليق:</strong> اكتب في إشعار التحويل: <span id="bookTitlePlaceholder"></span> - رقم الطلب (سيظهر بعد التأكيد)</p>
      </div>
      <div class="info-block">
        <h4>📱 تحويل كاشي:</h4>
        <p><strong>رقم الحساب:</strong> 0912345678</p>
        <p><strong>اسم صاحب الحساب:</strong> مؤسسة مكتبة الكتب</p>
      </div>
    </div>

    <div id="bankProofDiv" style="display:none;">
      <label>رقم الإيصال / معرف التحويل:</label>
      <input type="text" id="bankProof" placeholder="أدخل رقم الإيصال بعد التحويل">
    </div>

    <div id="autoPaymentInfo" style="display:none; background:#f0f0f0; padding:10px; border-radius:8px; margin:10px 0;"></div>

    <button class="btn" id="confirmPayBtn" onclick="createOrder()">تأكيد الطلب</button>
    <button class="btn" style="background:#ccc; color:#333;" onclick="closeModal()">إلغاء</button>
  </div>
</div>

<script src="/script.js"></script>
<script>
// ========== إعدادات سعر الصرف وفقاً للمعطى: 6.7 TRX = 1 USDT = 4000 عملة محلية = 1 دولار ==========
const USD_TO_LOCAL = 4000;        // 1 دولار = 4000 عملة محلية
const TRX_PER_USDT = 6.7;         // 1 USDT = 6.7 TRX
// سعر TRX بالدولار = 1 / TRX_PER_USDT = ~0.14925
// لحساب كمية TRX المطلوبة لكتاب سعره price دولار: trxAmount = price * TRX_PER_USDT
// لأن كل دولار يطلب 6.7 TRX.

let selectedBook = null;
let currentOrderId = null;
let currentMethod = null;

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => showToast('✅ تم نسخ العنوان')).catch(() => showToast('❌ فشل النسخ'));
}
function showToast(msg) {
  let toast = document.querySelector('.toast-msg');
  if (!toast) {
    toast = document.createElement('div');
    toast.className = 'toast-msg';
    document.body.appendChild(toast);
  }
  toast.innerText = msg;
  toast.style.display = 'block';
  setTimeout(() => toast.style.display = 'none', 2000);
}

fetch('/books.json')
  .then(r => r.json())
  .then(books => {
    const grid = document.getElementById('booksGrid');
    grid.innerHTML = books.map(book => `
      <div class="card">
        <img src="${book.cover}" style="width:100%; border-radius:8px;">
        <h3>${book.title}</h3>
        <p>السعر: ${book.price} $</p>
        <button class="btn" onclick='openModal(${JSON.stringify(book).replace(/"/g, '&quot;')})'>شراء</button>
      </div>
    `).join('');
  }).catch(e => console.error(e));

function openModal(book) {
  selectedBook = book;
  document.getElementById('bookTitlePlaceholder').innerText = book.title;
  const method = document.getElementById('payMethod').value;
  updatePriceAndInfo(method);
  document.getElementById('payModal').classList.add('active');
  currentOrderId = null;
}

function updatePriceAndInfo(method) {
  const priceSpan = document.getElementById('bookPrice');
  const usdPrice = selectedBook.price;
  if (method === 'bank') {
    const localAmount = (usdPrice * USD_TO_LOCAL).toFixed(2);
    priceSpan.innerText = `${localAmount} عملة محلية`;
    document.getElementById('bankAccountInfo').style.display = 'block';
    document.getElementById('bankProofDiv').style.display = 'block';
    document.getElementById('autoPaymentInfo').style.display = 'none';
  } 
  else if (method === 'usdt') {
    priceSpan.innerText = `${usdPrice} USDT`;
    document.getElementById('bankAccountInfo').style.display = 'none';
    document.getElementById('bankProofDiv').style.display = 'none';
    document.getElementById('autoPaymentInfo').style.display = 'none';
  }
  else if (method === 'trx') {
    const trxAmount = (usdPrice * TRX_PER_USDT).toFixed(2);
    priceSpan.innerText = `${trxAmount} TRX`;
    document.getElementById('bankAccountInfo').style.display = 'none';
    document.getElementById('bankProofDiv').style.display = 'none';
    document.getElementById('autoPaymentInfo').style.display = 'none';
  }
  const btn = document.getElementById('confirmPayBtn');
  btn.innerHTML = 'تأكيد الطلب';
  btn.onclick = createOrder;
}

document.getElementById('payMethod').addEventListener('change', (e) => {
  if (!selectedBook) return;
  updatePriceAndInfo(e.target.value);
});

function closeModal() {
  document.getElementById('payModal').classList.remove('active');
  document.getElementById('autoPaymentInfo').style.display = 'none';
  document.getElementById('bankAccountInfo').style.display = 'none';
}

async function createOrder() {
  const method = document.getElementById('payMethod').value;
  const usdPrice = selectedBook.price;

  let displayAmount = '';
  if (method === 'trx') {
    const trxAmount = (usdPrice * TRX_PER_USDT).toFixed(2);
    displayAmount = `${trxAmount} TRX`;
  } else if (method === 'usdt') {
    displayAmount = `${usdPrice} USDT`;
  } else if (method === 'bank') {
    const localAmount = (usdPrice * USD_TO_LOCAL).toFixed(2);
    displayAmount = `${localAmount} عملة محلية`;
  }

  let proof = null;
  if (method === 'bank') {
    proof = document.getElementById('bankProof').value.trim();
    if (!proof) return showToast('يرجى إدخال رقم الإيصال بعد التحويل');
  }

  const res = await api('/api/create-invoice', 'POST', {
    bookId: selectedBook.id,
    method,
    amount: usdPrice,   // نخزن السعر بالدولار في قاعدة البيانات
    proof
  });

  if (res.success) {
    if (method === 'bank') {
      alert(`✅ تم إنشاء الطلب رقم: ${res.orderId}\nالمبلغ المطلوب: ${displayAmount}\n\n📌 استخدم هذا الرقم عند التحويل.\nبعد التحويل، سجل رقم الإيصال في حقل الإثبات.`);
      window.location.href = '/orders.html';
    } else {
      currentOrderId = res.orderId;
      currentMethod = method;
      const address = method === 'trx' ? 'TArc3MovymaBrNmR4e4iRidLFx15BbDQ5L' : '0x1b90069d9503e1931d30a8884080cdf16bd0cded';
      const autoDiv = document.getElementById('autoPaymentInfo');
      autoDiv.innerHTML = `
        <p><strong>✅ رقم الطلب:</strong> ${currentOrderId}</p>
        <p>أرسل <strong>${displayAmount}</strong> إلى العنوان التالي:</p>
        <div class="copy-container">
          <span class="copy-address" onclick="copyToClipboard('${address}')">${address}</span>
          <button class="copy-btn" onclick="copyToClipboard('${address}')">📋 نسخ</button>
        </div>
        <p>📌 اكتب رقم الطلب <strong>${currentOrderId}</strong> في المذكرة (Memo).</p>
        <p>بعد الإرسال اضغط "تحققت من الدفع".</p>
      `;
      autoDiv.style.display = 'block';
      document.getElementById('payMethod').style.display = 'none';
      document.getElementById('bankProofDiv').style.display = 'none';
      document.getElementById('bankAccountInfo').style.display = 'none';
      document.querySelector('#payModal .modal-content p:first-of-type').style.display = 'none';
      const btn = document.getElementById('confirmPayBtn');
      btn.innerHTML = '🔍 تحققت من الدفع';
      btn.onclick = () => verifyPayment(currentOrderId, currentMethod, usdPrice);
      alert(`✅ تم إنشاء الطلب رقم: ${currentOrderId}\nالمبلغ المطلوب: ${displayAmount}\nبعد الإرسال اضغط "تحققت من الدفع".`);
    }
  } else {
    showToast('خطأ: ' + res.error);
  }
}

async function verifyPayment(orderId, method, usdPrice) {
  showToast('جاري التحقق...');
  let expectedAmount = usdPrice;
  if (method === 'trx') {
    expectedAmount = usdPrice * TRX_PER_USDT;  // كمية TRX المتوقعة
  } else if (method === 'usdt') {
    expectedAmount = usdPrice;  // نفس قيمة الدولار
  }
  const res = await api('/api/verify-payment', 'POST', { orderId, method, expectedAmount });
  if (res.success && res.approved) {
    showToast('✅ تم تأكيد الدفع! يمكنك التحميل من طلباتي');
    closeModal();
    window.location.href = '/orders.html';
  } else {
    showToast('❌ لم يتم العثور على الدفع. تأكد من المبلغ والمذكرة.');
  }
}
</script>
</body>
</html>
