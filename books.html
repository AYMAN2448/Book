<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الكتب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h2>مكتبة الكتب</h2>
  <nav>
    <a href="/">الرئيسية</a>
    <a href="/orders.html">طلباتي</a>
  </nav>
</header>

<div class="container">
  <h2>الكتب المتاحة</h2>
  <div class="grid" id="booksGrid"></div>
</div>

<!-- مودال الدفع -->
<div class="modal" id="payModal">
  <div class="modal-content">
    <h3>اختر طريقة الدفع</h3>
    <select id="payMethod">
      <option value="trx">TRX - تلقائي</option>
      <option value="usdt">USDT - تلقائي</option>
      <option value="bankak">بنكك - يدوي</option>
      <option value="cashi">كاشي - يدوي</option>
      <option value="vodafone">فودافون كاش - يدوي</option>
    </select>
    <input type="number" id="amount" placeholder="المبلغ" readonly>
    <button class="btn" onclick="createOrder()">تأكيد الطلب</button>
    <button class="btn" style="background:#ccc; color:#333;" onclick="closeModal()">إلغاء</button>
  </div>
</div>

<script src="/script.js"></script>
<script>
let selectedBook = null;

fetch('/books.json')
  .then(r => r.json())
  .then(books => {
    const grid = document.getElementById('booksGrid');
    grid.innerHTML = books.map(b => `
      <div class="card">
        <img src="${b.cover}" style="width:100%; border-radius:8px;">
        <h3>${b.title}</h3>
        <p>السعر: ${b.price} $</p>
        <button class="btn" onclick='openModal(${JSON.stringify(b)})'>شراء</button>
      </div>
    `).join('');
  });

function openModal(book) {
  selectedBook = book;
  document.getElementById('amount').value = book.price;
  document.getElementById('payModal').classList.add('active');
}

function closeModal() {
  document.getElementById('payModal').classList.remove('active');
}

async function createOrder() {
  const method = document.getElementById('payMethod').value;
  const amount = document.getElementById('amount').value;
  
  const res = await api('/api/create-invoice', 'POST', {
    bookId: selectedBook.id,
    method,
    amount
  });
  
  if (res.success) {
    if (res.autoApprove) {
      toast('تم الدفع تلقائياً! اذهب لصفحة طلباتي لتحميل الكتاب');
    } else {
      toast('تم إنشاء الطلب. ارفع إثبات الدفع من صفحة طلباتي');
    }
    closeModal();
    window.location.href = '/orders.html';
  } else {
    toast('حدث خطأ: ' + res.error);
  }
}
</script>
</body>
</html>
