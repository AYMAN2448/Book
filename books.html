<!-- مودال الدفع -->
<div class="modal" id="payModal">
  <div class="modal-content">
    <h3>اختر طريقة الدفع</h3>
    <select id="payMethod">
      <option value="trx">TRX (تحقق تلقائي)</option>
      <option value="usdt">USDT (تحقق تلقائي)</option>
      <option value="bank">تحويل بنكي (يدوي)</option>
    </select>
    <p>سعر الكتاب: <span id="bookPrice"></span> $</p>
    
    <!-- حقل الإثبات (يظهر فقط عند اختيار بنكي) -->
    <div id="proofField" style="display:none;">
      <input type="text" id="proofNumber" placeholder="رقم الإيصال / معرف التحويل">
    </div>

    <div id="autoPaymentInfo" style="display:none; background:#f0f0f0; padding:10px; border-radius:8px; margin:10px 0;">
      <p>أرسل المبلغ إلى العنوان التالي:</p>
      <p id="paymentAddress"></p>
      <p>بعد الإرسال اضغط "تأكيد" وسيتم التحقق تلقائياً.</p>
    </div>
    
    <button class="btn" id="confirmPayBtn" onclick="createOrder()">تأكيد الطلب</button>
    <button class="btn" style="background:#ccc; color:#333;" onclick="closeModal()">إلغاء</button>
  </div>
</div>
