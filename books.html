<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>الكتب - مكتبة الكتب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h2>مكتبة الكتب</h2>
  <nav>
    <a href="/">الرئيسية</a>
    <a href="/orders.html">طلباتي</a>
  </nav>
</header>

<div class="container">
  <h2>الكتب المتاحة</h2>
  <div class="grid" id="booksGrid"></div>
</div>

<div class="modal" id="payModal">
  <div class="modal-content">
    <h3>اختر طريقة الدفع</h3>
    <select id="payMethod">
      <option value="trx">TRX (تحقق تلقائي)</option>
      <option value="usdt">USDT (تحقق تلقائي)</option>
      <option value="bank">تحويل بنكي (يدوي)</option>
    </select>
    <p>سعر الكتاب: <span id="bookPrice"></span> $</p>
    <div id="bankProofDiv" style="display:none;">
      <label>رقم الإيصال / معرف التحويل:</label>
      <input type="text" id="bankProof" placeholder="أدخل رقم الإيصال">
    </div>
    <div id="autoPaymentInfo" style="display:none; background:#f0f0f0; padding:10px; border-radius:8px; margin:10px 0;">
      <p>أرسل المبلغ إلى العنوان التالي:</p>
      <p id="paymentAddress"></p>
      <p>بعد الإرسال اضغط "تحققت من الدفع"</p>
    </div>
    <button class="btn" id="confirmPayBtn" onclick="createOrder()">تأكيد الطلب</button>
    <button class="btn" style="background:#ccc; color:#333;" onclick="closeModal()">إلغاء</button>
  </div>
</div>

<script src="/script.js"></script>
<script>
let selectedBook = null;

fetch('/books.json')
  .then(r => r.json())
  .then(books => {
    const grid = document.getElementById('booksGrid');
    grid.innerHTML = books.map(b => `
      <div class="card">
        <img src="${b.cover}" style="width:100%; border-radius:8px;">
        <h3>${b.title}</h3>
        <p>السعر: ${b.price} $</p>
        <button class="btn" onclick='openModal(${JSON.stringify(b).replace(/"/g, '&quot;')})'>شراء</button>
      </div>
    `).join('');
  });

function openModal(book) {
  selectedBook = book;
  document.getElementById('bookPrice').innerText = book.price;
  document.getElementById('payModal').classList.add('active');
  togglePaymentInfo(document.getElementById('payMethod').value);
}

function togglePaymentInfo(method) {
  const autoDiv = document.getElementById('autoPaymentInfo');
  const bankDiv = document.getElementById('bankProofDiv');
  if (method === 'trx' || method === 'usdt') {
    autoDiv.style.display = 'block';
    bankDiv.style.display = 'none';
    let address = method === 'trx' ? 'TArc3MovymaBrNmR4e4iRidLFx15BbDQ5L' : '0x1b90069d9503e1931d30a8884080cdf16bd0cded';
    document.getElementById('paymentAddress').innerText = address;
    document.getElementById('confirmPayBtn').innerText = 'تحققت من الدفع';
  } else {
    autoDiv.style.display = 'none';
    bankDiv.style.display = 'block';
    document.getElementById('confirmPayBtn').innerText = 'تأكيد الطلب وإرسال الإيصال';
  }
}

document.getElementById('payMethod').addEventListener('change', (e) => togglePaymentInfo(e.target.value));

function closeModal() {
  document.getElementById('payModal').classList.remove('active');
}

async function createOrder() {
  const method = document.getElementById('payMethod').value;
  const amount = selectedBook.price;
  let proof = null;
  if (method === 'bank') {
    proof = document.getElementById('bankProof').value.trim();
    if (!proof) return toast('يرجى إدخال رقم الإيصال');
  }
  const res = await api('/api/create-invoice', 'POST', {
    bookId: selectedBook.id,
    method,
    amount,
    proof
  });
  if (res.success) {
    toast(method === 'bank' ? 'تم إنشاء الطلب. سيتم مراجعة الإيصال من قبل الأدمن' : 'تم إنشاء الطلب، سيتم التحقق تلقائياً');
    closeModal();
    window.location.href = '/orders.html';
  } else {
    toast('حدث خطأ: ' + res.error);
  }
}
</script>
</body>
</html>
