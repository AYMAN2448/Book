<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الكتب - مكتبة الكتب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  .copy-container {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    direction: ltr;
    word-break: break-all;
    margin: 10px 0;
    border: 1px solid #ddd;
  }
  .copy-address {
    flex: 1;
    font-family: monospace;
    font-size: 14px;
    cursor: pointer;
    user-select: all;
  }
  .copy-btn {
    background: #e94560;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 14px;
  }
  .copy-btn:hover { background: #c72a48; }
  .toast-msg {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    padding: 8px 16px;
    border-radius: 30px;
    font-size: 14px;
    z-index: 2000;
    opacity: 0.9;
  }
</style>
</head>
<body>
<header>
  <h2>مكتبة الكتب</h2>
  <nav>
    <a href="/">الرئيسية</a>
    <a href="/orders.html">طلباتي</a>
  </nav>
</header>

<div class="container">
  <h2>الكتب المتاحة</h2>
  <div class="grid" id="booksGrid"></div>
</div>

<!-- مودال الدفع -->
<div class="modal" id="payModal">
  <div class="modal-content">
    <h3>اختر طريقة الدفع</h3>
    <select id="payMethod">
      <option value="trx">TRX (تحقق تلقائي)</option>
      <option value="usdt">USDT (تحقق تلقائي)</option>
      <option value="bank">تحويل بنكي (يدوي)</option>
    </select>
    <p>سعر الكتاب: <span id="bookPrice"></span> $</p>

    <div id="bankProofDiv" style="display:none;">
      <label>رقم الإيصال / معرف التحويل:</label>
      <input type="text" id="bankProof" placeholder="أدخل رقم الإيصال">
    </div>

    <div id="autoPaymentInfo" style="display:none; background:#f0f0f0; padding:10px; border-radius:8px; margin:10px 0;"></div>

    <button class="btn" id="confirmPayBtn" onclick="createOrder()">تأكيد الطلب</button>
    <button class="btn" style="background:#ccc; color:#333;" onclick="closeModal()">إلغاء</button>
  </div>
</div>

<!-- زر الدعم -->
<div class="support-float">
  <div class="support-btn" id="supportBtn" onclick="toggleSupportMenu()">💬</div>
  <div class="support-menu" id="supportMenu">
    <a href="https://t.me/username" target="_blank" class="telegram"><span>📱</span> الدعم عبر تيليجرام</a>
    <a href="https://m.me/pageusername" target="_blank" class="facebook"><span>📘</span> الدعم عبر فيسبوك</a>
  </div>
</div>

<script src="/script.js"></script>
<script>
let selectedBook = null;
let currentOrderId = null;
let currentMethod = null;

function copyToClipboard(text, elementId) {
  navigator.clipboard.writeText(text).then(() => {
    showToast('✅ تم نسخ العنوان');
  }).catch(() => showToast('❌ فشل النسخ'));
}
function showToast(msg) {
  let toast = document.querySelector('.toast-msg') || (() => { let d = document.createElement('div'); d.className = 'toast-msg'; document.body.appendChild(d); return d; })();
  toast.innerText = msg;
  toast.style.display = 'block';
  setTimeout(() => toast.style.display = 'none', 2000);
}

fetch('/books.json').then(r=>r.json()).then(books => {
  document.getElementById('booksGrid').innerHTML = books.map(b => `
    <div class="card"><img src="${b.cover}"><h3>${b.title}</h3><p>السعر: ${b.price} $</p><button class="btn" onclick='openModal(${JSON.stringify(b).replace(/"/g, '&quot;')})'>شراء</button></div>
  `).join('');
});

function openModal(book) {
  selectedBook = book;
  document.getElementById('bookPrice').innerText = book.price;
  const method = document.getElementById('payMethod').value;
  document.getElementById('bankProofDiv').style.display = method === 'bank' ? 'block' : 'none';
  document.getElementById('autoPaymentInfo').style.display = 'none';
  const btn = document.getElementById('confirmPayBtn');
  btn.innerHTML = 'تأكيد الطلب';
  btn.onclick = createOrder;
  currentOrderId = null;
  document.getElementById('payModal').classList.add('active');
}

document.getElementById('payMethod').addEventListener('change', e => {
  const method = e.target.value;
  document.getElementById('bankProofDiv').style.display = method === 'bank' ? 'block' : 'none';
  document.getElementById('autoPaymentInfo').style.display = 'none';
  const btn = document.getElementById('confirmPayBtn');
  btn.innerHTML = 'تأكيد الطلب';
  btn.onclick = createOrder;
  currentOrderId = null;
});

function closeModal() { document.getElementById('payModal').classList.remove('active'); }

async function createOrder() {
  const method = document.getElementById('payMethod').value;
  const amount = selectedBook.price;
  let proof = null;
  if (method === 'bank') {
    proof = document.getElementById('bankProof').value.trim();
    if (!proof) return toast('يرجى إدخال رقم الإيصال');
  }
  const res = await api('/api/create-invoice', 'POST', { bookId: selectedBook.id, method, amount, proof });
  if (res.success) {
    if (method === 'bank') {
      toast('تم إنشاء الطلب. سيتم مراجعة الإيصال');
      window.location.href = '/orders.html';
    } else {
      currentOrderId = res.orderId;
      currentMethod = method;
      const address = method === 'trx' ? 'TArc3MovymaBrNmR4e4iRidLFx15BbDQ5L' : '0x1b90069d9503e1931d30a8884080cdf16bd0cded';
      const autoDiv = document.getElementById('autoPaymentInfo');
      autoDiv.innerHTML = `
        <p><strong>✅ رقم الطلب:</strong> ${currentOrderId}</p>
        <p>أرسل <strong>${amount} ${method.toUpperCase()}</strong> إلى العنوان:</p>
        <div class="copy-container">
          <span class="copy-address" onclick="copyToClipboard('${address}','addr')">${address}</span>
          <button class="copy-btn" onclick="copyToClipboard('${address}','addr')">📋 نسخ</button>
        </div>
        <p>📌 اكتب رقم الطلب <strong>${currentOrderId}</strong> في المذكرة (Memo).</p>
        <p>بعد الإرسال اضغط "تحققت من الدفع".</p>
      `;
      autoDiv.style.display = 'block';
      const btn = document.getElementById('confirmPayBtn');
      btn.innerHTML = '🔍 تحققت من الدفع';
      btn.onclick = () => verifyPayment(currentOrderId, currentMethod);
      alert(`✅ تم إنشاء الطلب رقم: ${currentOrderId}\nيمكنك نسخ العنوان والدفع ثم الضغط على تحققت من الدفع.`);
    }
  } else toast('خطأ: ' + res.error);
}

async function verifyPayment(orderId, method) {
  toast('جاري التحقق...');
  const res = await api('/api/verify-payment', 'POST', { orderId, method });
  if (res.success && res.approved) {
    toast('✅ تم تأكيد الدفع! يمكنك التحميل من صفحة طلباتي');
    closeModal();
    window.location.href = '/orders.html';
  } else toast('❌ لم يتم العثور على الدفع. تأكد من المبلغ والمذكرة.');
}
</script>
</body>
</html>
