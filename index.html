<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة الكتب الرقمية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  .copy-container { display: flex; align-items: center; gap: 8px; background: #fff; padding: 8px 12px; border-radius: 8px; direction: ltr; margin: 10px 0; border: 1px solid #ddd; }
  .copy-address { flex: 1; font-family: monospace; font-size: 14px; cursor: pointer; user-select: all; }
  .copy-btn { background: #e94560; color: white; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  .toast-msg { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 16px; border-radius: 30px; z-index: 2000; }
  .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; margin-top: 30px; }
</style>
</head>
<body>
<header>
  <h2>مكتبة الكتب</h2>
  <nav>
    <a href="/">الرئيسية</a>
    <a href="/books.html">الكتب</a>
    <a href="/orders.html">طلباتي</a>
    <a href="/admin-login.html">الأدمن</a>
  </nav>
</header>

<div class="container">
  <h1 style="text-align:center;">مرحباً بك في مكتبة الكتب الرقمية</h1>
  <p style="text-align:center;">اختر كتابك المفضل وادفع بسهولة (عملات رقمية أو تحويل بنكك او كاشي )</p>
  <div class="books-grid" id="homeBooksGrid">جاري تحميل الكتب...</div>
</div>

<!-- مودال الدفع -->
<div class="modal" id="payModal">
  <div class="modal-content">
    <h3>اختر طريقة الدفع</h3>
    <select id="payMethod">
      <option value="trx">TRX (تحقق تلقائي)</option>
      <option value="usdt">USDT (تحقق تلقائي)</option>
      <option value="bank">تحويل بنكك او كاشي (يدوي)</option>
    </select>
    <p>سعر الكتاب: <span id="bookPrice"></span></p>
    <div id="bankProofDiv" style="display:none;"><label>رقم الإيصال / رقم العملية :</label><input type="text" id="bankProof" placeholder="أدخل رقم الإيصال"></div>
    <div id="autoPaymentInfo" style="display:none;"></div>
    <button class="btn" id="confirmPayBtn" onclick="createOrder()">تأكيد الطلب</button>
    <button class="btn" style="background:#ccc; color:#333;" onclick="closeModal()">إلغاء</button>
  </div>
</div>

<!-- زر الدعم -->
<div class="support-float">
  <div class="support-btn" id="supportBtn" onclick="toggleSupportMenu()"> للبلاغ او الاستفسار💬</div>
  <div class="support-menu" id="supportMenu">
    <a href="https://t.me/username" target="_blank">📱 تيليجرام</a>
    <a href="https://m.me/pageusername" target="_blank">📘 فيسبوك</a>
  </div>
</div>

<script src="/script.js"></script>
<script>
// بيانات الكتب الاحتياطية (في حال فشل تحميل books.json)
const fallbackBooks = [
  { id: 1, title: "أساسيات البرمجة", price: 5, cover: "https://via.placeholder.com/200x280", file_url: "#" },
  { id: 2, title: "تعلم JavaScript", price: 7, cover: "https://via.placeholder.com/200x280", file_url: "#" }
];

const LOCAL_CURRENCY_RATE = 4000;
const LOCAL_CURRENCY_NAME = "جنيه سوداني ";
let selectedBook = null;
let currentOrderId = null;
let currentMethod = null;

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => showToast('✅ تم نسخ العنوان')).catch(() => showToast('❌ فشل النسخ'));
}
function showToast(msg) {
  let toast = document.querySelector('.toast-msg');
  if (!toast) {
    toast = document.createElement('div');
    toast.className = 'toast-msg';
    document.body.appendChild(toast);
  }
  toast.innerText = msg;
  toast.style.display = 'block';
  setTimeout(() => toast.style.display = 'none', 2000);
}

// تحميل الكتب من books.json أو استخدام الاحتياطي
fetch('/books.json')
  .then(res => {
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  })
  .then(books => {
    if (books && books.length) renderBooks(books);
    else renderBooks(fallbackBooks);
  })
  .catch(err => {
    console.warn('Failed to load books.json, using fallback', err);
    renderBooks(fallbackBooks);
  });

function renderBooks(books) {
  const grid = document.getElementById('homeBooksGrid');
  if (!grid) return;
  grid.innerHTML = books.map(book => `
    <div class="card">
      <img src="${book.cover}" style="width:100%; border-radius:8px;">
      <h3>${book.title}</h3>
      <p>السعر: ${book.price} $</p>
      <button class="btn" onclick='openModal(${JSON.stringify(book).replace(/"/g, '&quot;')})'>شراء</button>
    </div>
  `).join('');
}

function openModal(book) {
  selectedBook = book;
  const method = document.getElementById('payMethod').value;
  const priceSpan = document.getElementById('bookPrice');
  if (method === 'bank') {
    const localPrice = (book.price * LOCAL_CURRENCY_RATE).toFixed(2);
    priceSpan.innerText = `${localPrice} ${LOCAL_CURRENCY_NAME}`;
  } else {
    priceSpan.innerText = book.price;
  }
  document.getElementById('bankProofDiv').style.display = method === 'bank' ? 'block' : 'none';
  document.getElementById('autoPaymentInfo').style.display = 'none';
  const btn = document.getElementById('confirmPayBtn');
  btn.innerHTML = 'تأكيد الطلب';
  btn.onclick = createOrder;
  currentOrderId = null;
  document.getElementById('payModal').classList.add('active');
}

document.getElementById('payMethod').addEventListener('change', (e) => {
  if (!selectedBook) return;
  const method = e.target.value;
  const priceSpan = document.getElementById('bookPrice');
  if (method === 'bank') {
    const localPrice = (selectedBook.price * LOCAL_CURRENCY_RATE).toFixed(2);
    priceSpan.innerText = `${localPrice} ${LOCAL_CURRENCY_NAME}`;
  } else {
    priceSpan.innerText = selectedBook.price;
  }
  document.getElementById('bankProofDiv').style.display = method === 'bank' ? 'block' : 'none';
  document.getElementById('autoPaymentInfo').style.display = 'none';
  const btn = document.getElementById('confirmPayBtn');
  btn.innerHTML = 'تأكيد الطلب';
  btn.onclick = createOrder;
  currentOrderId = null;
});

function closeModal() {
  document.getElementById('payModal').classList.remove('active');
  document.getElementById('autoPaymentInfo').style.display = 'none';
}

async function createOrder() {
  const method = document.getElementById('payMethod').value;
  const amount = selectedBook.price;
  let proof = null;
  if (method === 'bank') {
    proof = document.getElementById('bankProof').value.trim();
    if (!proof) return toast('يرجى إدخال رقم الإيصال');
  }
  const res = await api('/api/create-invoice', 'POST', {
    bookId: selectedBook.id,
    method,
    amount,
    proof
  });
  if (res.success) {
    if (method === 'bank') {
      toast('تم إنشاء الطلب. انظر إلى نافذه طلباتي سيتم مراجعة الإيصال');
      window.location.href = '/orders.html';
    } else {
      currentOrderId = res.orderId;
      currentMethod = method;
      const address = method === 'trx' ? 'TArc3MovymaBrNmR4e4iRidLFx15BbDQ5L' : '0x1b90069d9503e1931d30a8884080cdf16bd0cded';
      const autoDiv = document.getElementById('autoPaymentInfo');
      autoDiv.innerHTML = `
        <p><strong>✅ رقم الطلب:</strong> ${currentOrderId}</p>
        <p>أرسل <strong>${amount} ${method.toUpperCase()}</strong> إلى العنوان:</p>
        <div class="copy-container">
          <span class="copy-address" onclick="copyToClipboard('${address}')">${address}</span>
          <button class="copy-btn" onclick="copyToClipboard('${address}')">📋 نسخ</button>
        </div>
        <p>📌 اكتب رقم الطلب <strong>${currentOrderId}</strong> في اشعار التحويل (Memo).</p>
        <p>بعد الإرسال اضغط "تحققت من الدفع".</p>
      `;
      autoDiv.style.display = 'block';
      document.getElementById('payMethod').style.display = 'none';
      document.getElementById('bankProofDiv').style.display = 'none';
      document.querySelector('#payModal .modal-content p:first-of-type').style.display = 'none';
      const btn = document.getElementById('confirmPayBtn');
      btn.innerHTML = '🔍 تحققت من الدفع';
      btn.onclick = () => verifyPayment(currentOrderId, currentMethod);
    }
  } else toast('خطأ: ' + res.error);
}

async function verifyPayment(orderId, method) {
  toast('جاري التحقق...');
  const res = await api('/api/verify-payment', 'POST', { orderId, method });
  if (res.success && res.approved) {
    toast('✅ تم تأكيد الدفع! انتقل إلى طلباتي');
    closeModal();
    window.location.href = '/orders.html';
  } else toast('❌ لم يتم العثور على الدفع.');
}
</script>
</body>
</html>
