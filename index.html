<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر الكتب</title>
<style>
  body{font-family:Tahoma;background:#f5f5f5;margin:0;padding:20px}
 .container{max-width:1000px;margin:auto}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
 .card{background:white;padding:15px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
 .card img{width:100%;height:200px;object-fit:cover;border-radius:8px}
  button{width:100%;padding:10px;border:none;border-radius:8px;background:#2c7;color:white;cursor:pointer;margin-top:5px}
  input{width:100%;padding:8px;margin:5px 0;border:1px solid #ddd;border-radius:6px;box-sizing:border-box}
 .nav{display:flex;gap:10px;margin-bottom:20px}
 .nav button{width:auto}
 .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5)}
 .modal-content{background:white;padding:20px;border-radius:12px;max-width:400px;margin:100px auto}
</style>
</head>
<body>
<div class="container">
  <div class="nav">
    <button onclick="showSection('store')">المتجر</button>
    <button onclick="showSection('orders')">طلباتي</button>
    <button id="authBtn" onclick="showAuth()">دخول</button>
  </div>

  <div id="store"></div>
  <div id="orders" style="display:none"></div>

  <div id="payModal" class="modal">
    <div class="modal-content">
      <h3>الدفع</h3>
      <div id="payContent"></div>
      <button onclick="closeModal()">إغلاق</button>
    </div>
  </div>
</div>

<script>
const API = '/api'
let token = localStorage.getItem('token')

async function api(path, opts={}) {
  if(token) opts.headers = {...opts.headers, 'Authorization': 'Bearer '+token}
  const res = await fetch(API+path, opts)
  return res.json()
}

function showSection(sec){
  document.getElementById('store').style.display = sec=='store'?'block':'none'
  document.getElementById('orders').style.display = sec=='orders'?'block':'none'
  if(sec=='store') loadBooks()
  if(sec=='orders') loadOrders()
}

async function loadBooks(){
  const books = await fetch('./books.json').then(r=>r.json())
  document.getElementById('store').innerHTML = '<div class="grid">'+books.map(b=>`
    <div class="card">
      <img src="${b.image}">
      <h3>${b.title}</h3>
      <p>${b.author}</p>
      <p><b>${b.price} USDT</b></p>
      <button onclick="buy('${b.id}')">شراء</button>
    </div>
  `).join('')+'</div>'
}

async function buy(bookId){
  if(!token) return showAuth()
  const res = await api('/create-invoice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bookId})})
  if(!res.success) return alert(res.error)
  document.getElementById('payModal').style.display='block'
  document.getElementById('payContent').innerHTML=`
    <p>اختر طريقة الدفع:</p>
    <button onclick="payCrypto('${res.invoiceId}')">دفع بالكريبتو</button>
    <button onclick="payBank('${res.orderId}')">دفع بنكي يدوي</button>
  `
}

function payCrypto(invoiceId){
  window.open(`https://t.me/CryptoBot?start=invoice_${invoiceId}`,'_blank')
}

function payBank(orderId){
  const file = prompt('ضع رابط صورة إثبات الدفع:')
  if(file) api('/submit-proof',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId,proof:file})})
  alert('تم إرسال الإثبات')
}

async function loadOrders(){
  if(!token) return document.getElementById('orders').innerHTML='سجل دخول أولاً'
  const res = await api('/my-orders')
  document.getElementById('orders').innerHTML=res.orders.map(o=>`
    <div class="card">
      <h4>${o.book_title}</h4>
      <p>الحالة: ${o.status}</p>
      ${o.status=='paid'?`<a href="${o.file_url}" download><button>تحميل الكتاب</button></a>`:''}
    </div>
  `).join('')
}

function showAuth(){
  document.getElementById('payModal').style.display='block'
  document.getElementById('payContent').innerHTML=`
    <input id="email" placeholder="الإيميل">
    <input id="pass" type="password" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
    <button onclick="register()">إنشاء حساب</button>
  `
}

async function register(){
  const res = await api('/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    email:email.value,password:pass.value
  })})
  if(res.success){token=res.token;localStorage.setItem('token',token);closeModal();updateAuthBtn()}
  else alert(res.error)
}

async function login(){
  const res = await api('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    email:email.value,password:pass.value
  })})
  if(res.success){token=res.token;localStorage.setItem('token',token);closeModal();updateAuthBtn()}
  else alert(res.error)
}

function closeModal(){document.getElementById('payModal').style.display='none'}
function updateAuthBtn(){document.getElementById('authBtn').textContent=token?'خروج':'دخول'}
updateAuthBtn();loadBooks()
</script>
</body>
</html>
