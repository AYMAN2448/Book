<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة تيليجرام</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script type="module">
const tg = window.Telegram.WebApp
tg.expand()

let cart = []
let userId = tg.initDataUnsafe.user?.id

// --- التبويب ---
window.showTab = (tab) => {
  document.getElementById('store').style.display = tab === 'store'? 'block' : 'none'
  document.getElementById('admin').style.display = tab === 'admin'? 'block' : 'none'
}

// --- تحميل الكتب من books.json ---
async function loadBooks() {
  try {
    const res = await fetch('./books.json')
    if(!res.ok) throw new Error('ملف الكتب ما موجود')
    const data = await res.json()
    
    let html = data.map(b => `
      <div class="book">
        <img src="${b.image}">
        <h3>${b.title}</h3>
        <p>${b.author}</p>
        <p><b>${b.price} USDT</b></p>
        <button onclick="addToCart('${b.id}', '${b.title}', ${b.price})">أضف للسلة</button>
      </div>
    `).join('')
    document.getElementById('books').innerHTML = html || '<p>لا توجد كتب حالياً</p>'
  } catch(err) {
    document.getElementById('books').innerHTML = '<p style="color:red">خطأ في تحميل الكتب</p>'
    console.error(err)
  }
}

window.addToCart = (id, title, price) => {
  cart.push({id, title, price})
  document.getElementById('cart-count').innerText = cart.length
  tg.showAlert(`تمت إضافة "${title}" للسلة`)
}

window.checkout = (method) => {
  if (cart.length === 0) return alert('السلة فاضية')
  const total = cart.reduce((sum, i) => sum + i.price, 0)

  if (method === 'crypto') {
    alert(`الدفع بـ USDT/TRX\nالمبلغ: ${total} USDT\nهذه نسخة تجريبية، ربط الدفع بيكون عبر CryptoBot بعدين`)
  }

  if (method === 'bank') {
    alert(`تحويل بنكي\nالمبلغ: ${total} USDT\nبنك الخرطوم 123456789\nرقم الحساب: 987654321\nأرسل الإيصال للبوت بعد التحويل`)
  }
  
  cart = []
  document.getElementById('cart-count').innerText = 0
}

// --- صفحة الإدارة - مؤقتاً معطلة ---
function checkAdmin() {
  const ADMIN_ID = 123456789 // غيرو لـ ID بتاعك
  if (userId !== ADMIN_ID) {
    document.getElementById('admin').innerHTML = '<p>غير مسموح. هذه الصفحة للأدمن فقط.</p>'
    return false
  }
  document.getElementById('admin-list').innerHTML = '<p>الإدارة شغالة من ملف books.json مباشرة حالياً</p>'
  return true
}

loadBooks()
checkAdmin()
</script>

<style>
body {font-family: sans-serif; padding: 15px; background: #f5f5f5; margin:0;}
.tabs {display: flex; gap: 10px; margin-bottom: 15px;}
.tabs button {flex: 1; padding: 10px; border: none; background: #ddd; border-radius: 8px; cursor:pointer;}
.books {display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px;}
.book {background: white; padding: 10px; border-radius: 10px; text-align:center; box-shadow:0 2px 5px rgba(0,0,0,0.1);}
.book img {width: 100%; height: 180px; object-fit: cover; border-radius: 6px;}
button {background: #0088cc; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; margin-top: 5px; cursor:pointer;}
input, textarea {width: 100%; padding: 8px; margin: 5px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing:border-box;}
</style>
</head>
<body>

<div class="tabs">
  <button onclick="showTab('store')">المتجر</button>
  <button onclick="showTab('admin')">الإدارة</button>
</div>

<!-- صفحة المتجر -->
<div id="store">
  <h2>📚 مكتبة الكتب</h2>
  <div>السلة: <span id="cart-count">0</span></div>
  <div id="books">جاري التحميل...</div>
  <hr>
  <button onclick="checkout('crypto')">الدفع بـ USDT/TRX</button>
  <button onclick="checkout('bank')" style="background:#28a745">تحويل بنكي</button>
</div>

<!-- صفحة الإدارة -->
<div id="admin" style="display:none">
  <h2>⚙️ إدارة الكتب</h2>
  <div id="admin-list">جاري التحميل...</div>
</div>

</body>
</html>
