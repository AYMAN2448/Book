<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  /* نفس الستايلات الموجودة في index.html */
  .copy-container, .copy-address, .copy-btn, .toast-msg, .info-block, .discount-badge, .old-price, .new-price, .card-buttons, .share-btn, .search-container, #searchInput, .no-results { /* كما هي */ }
  .card-buttons { display: flex; gap: 10px; margin-top: 10px; }
  .card-buttons .btn { flex: 1; margin: 0; }
  .share-btn { background: #4a6fa5; }
  .search-container { margin: 20px 0; text-align: center; }
  #searchInput { width: 100%; max-width: 400px; padding: 12px 20px; border: 2px solid #ddd; border-radius: 30px; }
  .no-results { text-align: center; padding: 40px; font-size: 18px; color: #999; }
</style>
</head>
<body>
<header>
  <h2>مكتبة سديم للكتب الإلكترونية</h2>
  <nav>
    <a href="/">الرئيسية</a>
    <a href="/orders.html">طلباتي</a>
  </nav>
</header>

<div class="container">
  <h2>الكتب المتاحة</h2>
  <div class="search-container">
    <input type="text" id="searchInput" placeholder="🔍 ابحث عن كتاب (عنوان، مؤلف)...">
  </div>
  <div class="grid" id="booksGrid"></div>
  <div id="noResultsMsg" class="no-results" style="display:none;">لا توجد كتب تطابق بحثك</div>
</div>

<!-- مودال الدفع (نفسه) -->
<div class="modal" id="payModal">
  <div class="modal-content">
    <h3>اختر طريقة الدفع</h3>
    <select id="payMethod">
      <option value="bank">تحويل كاشي (يدوي) - عملة محلية</option>
      <option value="usdt">USDT (تحقق تلقائي)</option>
      <option value="trx">TRX (تحقق تلقائي)</option>
    </select>
    <div id="priceDisplay"></div>
    <div id="bankAccountInfo" style="display:none;">
      <div class="discount-badge">🎉 عرض خاص! خصم 50% على الدفع بالعملة المحلية (ج.س) 🎉</div>
      <div class="info-block">
        <h4>📱 تحويل كاشي (Cash):</h4>
        <p><strong>رقم الحساب:</strong> 401951393</p>
        <p><strong>اسم صاحب الحساب:</strong> لبني احمد سعيد</p>
        <p><strong>ملاحظة:</strong> اذكر رقم الطلب عند الإرسال</p>
      </div>
    </div>
    <div id="bankProofDiv" style="display:none;">
      <label>رقم الإيصال / معرف التحويل:</label>
      <input type="text" id="bankProof" placeholder="أدخل رقم الإيصال بعد التحويل">
    </div>
    <div id="autoPaymentInfo" style="display:none; background:#f0f0f0; padding:10px; border-radius:8px; margin:10px 0;"></div>
    <button class="btn" id="confirmPayBtn" onclick="createOrder()">تأكيد الطلب</button>
    <button class="btn" style="background:#ccc; color:#333;" onclick="closeModal()">إلغاء</button>
  </div>
</div>

<script src="/script.js"></script>
<script>
// نفس المتغيرات والدوال الموجودة في index.html، مع تغيير معرف الشبكة إلى booksGrid
const USD_TO_LOCAL = 4000;
const LOCAL_CURRENCY_NAME = "ج.س";
const USD_TO_TRX = 6.7;
const DISCOUNT_RATE = 0.5;
const CRYPTO_ADDRESS = "TArc3MovymaBrNmR4e4iRidLFx15BbDQ5L";

let selectedBook = null;
let currentOrderId = null;
let currentMethod = null;
let allBooks = [];

function copyToClipboard(text) { navigator.clipboard.writeText(text).then(() => showToast('✅ تم نسخ العنوان')).catch(() => showToast('❌ فشل النسخ')); }
function showToast(msg) { let toast = document.querySelector('.toast-msg'); if (!toast) { toast = document.createElement('div'); toast.className = 'toast-msg'; document.body.appendChild(toast); } toast.innerText = msg; toast.style.display = 'block'; setTimeout(() => toast.style.display = 'none', 2000); }

function shareBook(bookId, bookTitle, bookPrice) {
  const url = `${window.location.origin}/book.html?id=${bookId}`;
  const shareText = `📚 ${bookTitle}${bookPrice > 0 ? ` - السعر: ${bookPrice} $` : ' (مجاني)'}\nلشراء الكتاب، افتح الرابط: ${url}`;
  if (navigator.share) { navigator.share({ title: bookTitle, text: shareText, url: url }).catch(e => console.log(e)); }
  else { navigator.clipboard.writeText(shareText).then(() => showToast('📋 تم نسخ رابط الكتاب')); }
}

async function downloadFreeBook(bookId) {
  showToast('جاري تجهيز الكتاب المجاني...');
  try {
    const res = await api('/api/create-invoice', 'POST', { bookId, method: 'free', amount: 0, proof: null });
    if (res.success && res.downloadToken) window.location.href = `/api/download?token=${res.downloadToken}`;
    else showToast('حدث خطأ أثناء تحميل الكتاب المجاني');
  } catch (err) { showToast('خطأ: ' + err.message); }
}

function renderBooks(books) {
  const grid = document.getElementById('booksGrid');
  const noResults = document.getElementById('noResultsMsg');
  if (!grid) return;
  if (books.length === 0) { grid.innerHTML = ''; noResults.style.display = 'block'; return; }
  noResults.style.display = 'none';
  grid.innerHTML = books.map(book => {
    const isFree = (book.price === 0);
    const priceDisplay = isFree ? '<span style="color:#27ae60; font-weight:bold;">🎁 مجاني</span>' : `${book.price} $`;
    const buttonText = isFree ? '📥 تحميل مجاني' : 'شراء';
    return `
      <div class="card">
        <img src="${book.cover}" style="width:100%; border-radius:8px;">
        <h3>${book.title}</h3>
        <p>${book.author ? `✍️ ${book.author}` : ''}</p>
        <p>💰 السعر: ${priceDisplay}</p>
        <div class="card-buttons">
          <button class="btn" onclick='${isFree ? `downloadFreeBook(${book.id})` : `openModal(${JSON.stringify(book).replace(/"/g, '&quot;')})`}'>${buttonText}</button>
          <button class="btn share-btn" onclick="shareBook(${book.id}, '${book.title.replace(/'/g, "\\'")}', ${book.price})">📤 مشاركة</button>
        </div>
      </div>
    `;
  }).join('');
}

fetch('/books.json')
  .then(r => r.json())
  .then(books => {
    allBooks = books;
    renderBooks(allBooks);
    const searchInput = document.getElementById('searchInput');
    if (searchInput) searchInput.addEventListener('input', () => {
      const query = searchInput.value.trim().toLowerCase();
      if (!query) renderBooks(allBooks);
      else {
        const filtered = allBooks.filter(book => book.title.toLowerCase().includes(query) || (book.author && book.author.toLowerCase().includes(query)));
        renderBooks(filtered);
      }
    });
  }).catch(e => console.error(e));

// دوال الدفع (نفس التي في index.html)
function openModal(book) { selectedBook = book; const method = document.getElementById('payMethod').value; updatePriceAndInfo(method); document.getElementById('payModal').classList.add('active'); currentOrderId = null; }
function updatePriceAndInfo(method) { /* كما هي */ }
document.getElementById('payMethod').addEventListener('change', (e) => { if (!selectedBook) return; updatePriceAndInfo(e.target.value); });
function closeModal() { document.getElementById('payModal').classList.remove('active'); document.getElementById('autoPaymentInfo').style.display = 'none'; document.getElementById('bankAccountInfo').style.display = 'none'; }
async function createOrder() { /* كما هي مع دعم autoDownload */ }
async function verifyPayment(orderId, method, usdPrice) { /* كما هي */ }
// لاحظ: يجب نسخ كامل دوال createOrder, verifyPayment من index.html لضمان عمل الدفع.
// لتجنب التكرار، يمكنك استخدام نفس الكود الموجود في index.html أعلاه.
</script>
</body>
</html>
