<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h2>لوحة التحكم</h2>
  <button class="btn" onclick="logout()" style="background:#ccc; color:#333;">خروج</button>
</header>
<div class="container">
  <h3>الطلبات المعلقة</h3>
  <div id="ordersList"></div>
</div>

<!-- زر الدعم العائم (اختياري) -->
<div class="support-float">
  <div class="support-btn" id="supportBtn" onclick="toggleSupportMenu()">💬</div>
  <div class="support-menu" id="supportMenu">
    <a href="https://t.me/username" target="_blank" class="telegram">📱 الدعم عبر تيليجرام</a>
    <a href="https://m.me/pageusername" target="_blank" class="facebook">📘 الدعم عبر فيسبوك</a>
  </div>
</div>

<script src="/script.js"></script>
<script>
const token = localStorage.getItem('admin_token');
if (!token) location.href = '/admin-login.html';

async function loadOrders() {
  const res = await fetch('/api/admin/orders', {
    headers: { 'Authorization': 'Bearer ' + token }
  });
  const data = await res.json();
  if (!data.success) {
    localStorage.removeItem('admin_token');
    location.href = '/admin-login.html';
    return;
  }
  const list = document.getElementById('ordersList');
  if (!data.orders.length) {
    list.innerHTML = '<p>لا توجد طلبات معلقة</p>';
    return;
  }
  list.innerHTML = data.orders.map(o => `
    <div class="card">
      <h4>📖 الكتاب: ${o.book_title || 'غير معروف'}</h4>
      <p>👤 رقم المستخدم: ${o.user_id}</p>
      <p>💰 المبلغ: ${o.amount} $</p>
      <p>🔢 رقم الطلب: ${o.id}</p>
      <p>📱 طريقة الدفع: ${o.method === 'bank' ? 'تحويل كاشي' : o.method.toUpperCase()}</p>
      <p>📝 الحالة: <span class="status ${o.status}">${o.status === 'pending' ? 'قيد الانتظار' : 'مراجعة'}</span></p>
      ${o.proof ? `<p>🧾 رقم الإيصال / المعرف: <strong>${o.proof}</strong></p>` : ''}
      <div style="margin-top:10px;">
        <button class="btn" onclick="updateOrder(${o.id}, 'approve')">✅ موافقة</button>
        <button class="btn" onclick="updateOrder(${o.id}, 'reject')" style="background:#d63031;">❌ رفض</button>
      </div>
    </div>
  `).join('');
}

async function updateOrder(orderId, action) {
  const res = await fetch('/api/admin/orders', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token
    },
    body: JSON.stringify({ orderId, action })
  });
  const data = await res.json();
  if (data.success) {
    alert('تم التحديث');
    loadOrders();
  } else {
    alert('خطأ: ' + data.error);
  }
}

function logout() {
  localStorage.removeItem('admin_token');
  location.href = '/admin-login.html';
}
loadOrders();
</script>
</body>
</html>
