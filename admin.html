<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  /* إضافة تنسيق بسيط للأقسام (بدون تغيير التصميم العام) */
  .section { margin-bottom: 30px; }
  .section-title { background: #1a1a2e; color: white; padding: 8px 12px; border-radius: 8px; margin-bottom: 15px; }
  .load-more-btn, .pagination-btn { background: #e94560; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin: 5px; }
  .load-more-btn:disabled, .pagination-btn:disabled { background: #ccc; cursor: not-allowed; }
  .free-notification { border-right: 4px solid #27ae60; }
  .free-counter { background: #27ae60; color: white; padding: 5px 10px; border-radius: 20px; display: inline-block; margin-bottom: 15px; font-weight: bold; }
  .pagination-controls { margin-top: 15px; text-align: center; }
</style>
</head>
<body>
<header>
  <h2>لوحة التحكم</h2>
  <button class="btn" onclick="logout()" style="background:#ccc; color:#333;">خروج</button>
</header>
<div class="container">
  <!-- عداد الكتب المجانية المحملة -->
  <div class="free-counter" id="freeCounter">📊 عدد الكتب المجانية المحملة: 0</div>

  <!-- قسم آخر 4 كتب مجانية تم تحميلها -->
  <div class="section">
    <div class="section-title">📢 آخر 4 كتب تم تحميلها مجاناً</div>
    <div id="freeList"></div>
  </div>

  <!-- قسم الطلبات المكتملة (غير المجانية) – 5 لكل صفحة -->
  <div class="section">
    <div class="section-title">✅ الطلبات المكتملة (آخر 5)</div>
    <div id="approvedList"></div>
    <div class="pagination-controls" id="approvedPagination"></div>
  </div>

  <!-- قسم الطلبات المعلقة – 10 لكل صفحة -->
  <div class="section">
    <div class="section-title">⏳ الطلبات المعلقة (تحتاج موافقة)</div>
    <div id="pendingList"></div>
    <div class="pagination-controls" id="pendingPagination"></div>
  </div>
</div>

<script>
const token = localStorage.getItem('admin_token');
if (!token) location.href = '/admin-login.html';

let currentPendingPage = 1;
let currentApprovedPage = 1;
let pendingTotalPages = 1;
let approvedTotalPages = 1;

async function loadData() {
  try {
    const res = await fetch(`/api/admin/orders?pending_page=${currentPendingPage}&approved_page=${currentApprovedPage}`, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const data = await res.json();
    if (!data.success) {
      localStorage.removeItem('admin_token');
      location.href = '/admin-login.html';
      return;
    }

    // تحديث العداد
    document.getElementById('freeCounter').innerText = `📊 عدد الكتب المجانية المحملة: ${data.freeTotal}`;

    // عرض آخر 4 كتب مجانية
    const freeDiv = document.getElementById('freeList');
    if (data.free && data.free.length) {
      freeDiv.innerHTML = data.free.map(f => `
        <div class="card free-notification">
          <h4>📖 ${f.book_title}</h4>
          <p>📅 التاريخ: ${new Date(f.created_at).toLocaleString('ar-EG')}</p>
          <p>🎁 تم تحميله مجاناً</p>
        </div>
      `).join('');
    } else {
      freeDiv.innerHTML = '<p>لا توجد كتب مجانية محملة بعد</p>';
    }

    // عرض الطلبات المكتملة (غير المجانية) مع ترحيل
    const approvedDiv = document.getElementById('approvedList');
    if (data.approved && data.approved.length) {
      approvedDiv.innerHTML = data.approved.map(o => `
        <div class="card">
          <h4>📖 ${o.book_title}</h4>
          <p>💰 المبلغ: ${o.amount} $</p>
          <p>👤 المستخدم: ${o.user_display || 'غير معروف'}</p>
          <p>📱 طريقة الدفع: ${o.method === 'bank' ? 'تحويل كاشي' : o.method.toUpperCase()}</p>
          <p>✅ تمت الموافقة بتاريخ: ${new Date(o.updated_at).toLocaleString('ar-EG')}</p>
        </div>
      `).join('');
    } else {
      approvedDiv.innerHTML = '<p>لا توجد طلبات مكتملة (غير مجانية) بعد</p>';
    }
    // حساب عدد الصفحات للطلبات المكتملة
    approvedTotalPages = Math.ceil(data.approvedTotal / 5);
    renderApprovedPagination();

    // عرض الطلبات المعلقة مع ترحيل
    const pendingDiv = document.getElementById('pendingList');
    if (data.pending && data.pending.length) {
      pendingDiv.innerHTML = data.pending.map(o => `
        <div class="card">
          <h4>📖 ${o.book_title}</h4>
          <p>👤 المستخدم: ${o.user_display || 'غير معروف'}</p>
          <p>💰 المبلغ: ${o.amount} $</p>
          <p>🔢 رقم الطلب: ${o.id}</p>
          <p>📱 طريقة الدفع: ${o.method === 'bank' ? 'تحويل كاشي' : o.method.toUpperCase()}</p>
          <p>📝 الحالة: <span class="status ${o.status}">${o.status === 'pending' ? 'قيد الانتظار' : 'مراجعة'}</span></p>
          ${o.proof ? `<p>🧾 رقم الإيصال: <strong>${o.proof}</strong></p>` : ''}
          <div style="margin-top:10px;">
            <button class="btn" onclick="updateOrder(${o.id}, 'approve')">✅ موافقة</button>
            <button class="btn" onclick="updateOrder(${o.id}, 'reject')" style="background:#d63031;">❌ رفض</button>
          </div>
        </div>
      `).join('');
    } else {
      pendingDiv.innerHTML = '<p>لا توجد طلبات معلقة</p>';
    }
    // حساب عدد الصفحات للطلبات المعلقة
    pendingTotalPages = Math.ceil(data.pendingTotal / 10);
    renderPendingPagination();
  } catch (err) {
    console.error(err);
  }
}

function renderApprovedPagination() {
  const container = document.getElementById('approvedPagination');
  if (approvedTotalPages <= 1) {
    container.innerHTML = '';
    return;
  }
  let html = '<div style="margin-top:10px;">';
  if (currentApprovedPage > 1) {
    html += `<button class="pagination-btn" onclick="changeApprovedPage(${currentApprovedPage - 1})">⟪ السابق</button>`;
  }
  html += `<span style="margin:0 10px;">الصفحة ${currentApprovedPage} من ${approvedTotalPages}</span>`;
  if (currentApprovedPage < approvedTotalPages) {
    html += `<button class="pagination-btn" onclick="changeApprovedPage(${currentApprovedPage + 1})">التالي ⟫</button>`;
  }
  html += '</div>';
  container.innerHTML = html;
}

function renderPendingPagination() {
  const container = document.getElementById('pendingPagination');
  if (pendingTotalPages <= 1) {
    container.innerHTML = '';
    return;
  }
  let html = '<div style="margin-top:10px;">';
  if (currentPendingPage > 1) {
    html += `<button class="pagination-btn" onclick="changePendingPage(${currentPendingPage - 1})">⟪ السابق</button>`;
  }
  html += `<span style="margin:0 10px;">الصفحة ${currentPendingPage} من ${pendingTotalPages}</span>`;
  if (currentPendingPage < pendingTotalPages) {
    html += `<button class="pagination-btn" onclick="changePendingPage(${currentPendingPage + 1})">التالي ⟫</button>`;
  }
  html += '</div>';
  container.innerHTML = html;
}

function changeApprovedPage(page) {
  currentApprovedPage = page;
  loadData();
}

function changePendingPage(page) {
  currentPendingPage = page;
  loadData();
}

async function updateOrder(orderId, action) {
  const res = await fetch('/api/admin/orders', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token
    },
    body: JSON.stringify({ orderId, action })
  });
  const data = await res.json();
  if (data.success) {
    alert('تم التحديث');
    // إعادة تحميل جميع الأقسام مع الصفحة الحالية
    loadData();
  } else {
    alert('خطأ: ' + data.error);
  }
}

function logout() {
  localStorage.removeItem('admin_token');
  location.href = '/admin-login.html';
}

// التحميل الأولي
loadData();
</script>
</body>
</html>
