<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  .section { margin-bottom: 30px; }
  .section-title { background: #1a1a2e; color: white; padding: 8px 12px; border-radius: 8px; margin-bottom: 15px; }
  .completed { border-right: 4px solid #00b894; }
  .timestamp { font-size: 0.7rem; color: #777; margin-top: 5px; }
</style>
</head>
<body>
<header>
  <h2>لوحة التحكم</h2>
  <button class="btn" onclick="logout()" style="background:#ccc; color:#333;">خروج</button>
</header>
<div class="container">
  <div class="section">
    <div class="section-title">⏳ الطلبات المعلقة (تحتاج موافقة)</div>
    <div id="pendingOrdersList"></div>
  </div>
  <div class="section">
    <div class="section-title">✅ آخر الطلبات المكتملة (تلقائياً أو يدوياً)</div>
    <div id="completedOrdersList"></div>
  </div>
</div>

<script>
const token = localStorage.getItem('admin_token');
if (!token) location.href = '/admin-login.html';

let autoRefreshInterval = null;

async function loadOrders() {
  const res = await fetch('/api/admin/orders', {
    headers: { 'Authorization': 'Bearer ' + token }
  });
  const data = await res.json();
  if (!data.success) {
    localStorage.removeItem('admin_token');
    location.href = '/admin-login.html';
    return;
  }

  // عرض الطلبات المعلقة
  const pendingDiv = document.getElementById('pendingOrdersList');
  if (!data.pending.length) {
    pendingDiv.innerHTML = '<p>لا توجد طلبات معلقة</p>';
  } else {
    pendingDiv.innerHTML = data.pending.map(o => `
      <div class="card">
        <h4>📖 الكتاب: ${o.book_title || 'غير معروف'}</h4>
        <p>💰 المبلغ: ${o.amount} $</p>
        <p>🔢 رقم الطلب: ${o.id}</p>
        <p>📱 طريقة الدفع: ${o.method === 'bank' ? 'تحويل كاشي' : o.method.toUpperCase()}</p>
        <p>📝 الحالة: <span class="status ${o.status}">${o.status === 'pending' ? 'قيد الانتظار' : 'مراجعة'}</span></p>
        ${o.proof ? `<p>🧾 رقم الإيصال: <strong>${o.proof}</strong></p>` : ''}
        <div style="margin-top:10px;">
          <button class="btn" onclick="updateOrder(${o.id}, 'approve')">✅ موافقة</button>
          <button class="btn" onclick="updateOrder(${o.id}, 'reject')" style="background:#d63031;">❌ رفض</button>
        </div>
      </div>
    `).join('');
  }

  // عرض الطلبات المكتملة
  const completedDiv = document.getElementById('completedOrdersList');
  if (!data.completed.length) {
    completedDiv.innerHTML = '<p>لا توجد طلبات مكتملة بعد</p>';
  } else {
    completedDiv.innerHTML = data.completed.map(o => `
      <div class="card completed">
        <h4>📖 الكتاب: ${o.book_title || 'غير معروف'}</h4>
        <p>💰 المبلغ: ${o.amount} $</p>
        <p>📱 طريقة الدفع: ${o.method === 'bank' ? 'تحويل كاشي' : o.method.toUpperCase()}</p>
        <p>✅ الحالة: تمت الموافقة (${o.method === 'trx' || o.method === 'usdt' ? 'دفع تلقائي' : 'يدوي'})</p>
        <div class="timestamp">📅 تم الإتمام: ${new Date(o.updated_at).toLocaleString('ar-EG')}</div>
      </div>
    `).join('');
  }
}

async function updateOrder(orderId, action) {
  const res = await fetch('/api/admin/orders', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token
    },
    body: JSON.stringify({ orderId, action })
  });
  const data = await res.json();
  if (data.success) {
    alert('تم التحديث');
    loadOrders(); // إعادة تحميل فورية
  } else {
    alert('خطأ: ' + data.error);
  }
}

function logout() {
  localStorage.removeItem('admin_token');
  location.href = '/admin-login.html';
}

// تحميل أول مرة
loadOrders();

// تحديث تلقائي كل 30 ثانية
autoRefreshInterval = setInterval(loadOrders, 30000);

// إيقاف التحديث عند مغادرة الصفحة (اختياري)
window.addEventListener('beforeunload', () => {
  if (autoRefreshInterval) clearInterval(autoRefreshInterval);
});
</script>
</body>
</html>
