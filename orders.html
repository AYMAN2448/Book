<script>
const USD_TO_LOCAL = 4000;
const LOCAL_CURRENCY_NAME = "ج.س";
const USD_TO_TRX = 6.7;
const DISCOUNT_RATE = 0.3;

let currentOrderId = null, resumeOrderId = null, resumeMethod = null, resumeAmount = null;

loadOrders();
async function loadOrders() {
  const res = await api('/api/orders');
  if (!res.success) return;
  const orders = res.orders;
  const list = document.getElementById('ordersList');
  if (!orders.length) { list.innerHTML = '<p>لا توجد طلبات بعد</p>'; return; }
  list.innerHTML = orders.map(o => {
    let currencyValue = '';
    if (o.method === 'free' || o.amount === 0) currencyValue = '<span class="free-badge">🎁 مجاني</span>';
    else if (o.method === 'bank') {
      const original = o.amount * USD_TO_LOCAL, discounted = original * (1 - DISCOUNT_RATE);
      currencyValue = `<span class="old-price">${original.toFixed(2)} ${LOCAL_CURRENCY_NAME}</span> <span class="new-price">${discounted.toFixed(2)} ${LOCAL_CURRENCY_NAME}</span> (بعد خصم ${DISCOUNT_RATE*100}%)`;
    } else if (o.method === 'usdt') currencyValue = `${o.amount} USDT`;
    else if (o.method === 'trx') currencyValue = `${(o.amount * USD_TO_TRX).toFixed(2)} TRX`;
    else currencyValue = `${o.amount} $`;
    let statusText = '';
    if (o.status === 'pending') statusText = '⏳ قيد الانتظار';
    else if (o.status === 'pending_review') statusText = '🔍 جاري مراجعة الإيصال';
    else if (o.status === 'approved') statusText = '✅ تمت الموافقة';
    else statusText = '❌ مرفوض';
    return `
      <div class="card">
        <h3>📖 ${o.book_title || 'كتاب غير معروف'}</h3>
        <p>💰 المبلغ المطلوب: ${currencyValue}</p>
        <p>📌 الحالة: <span class="status ${o.status}">${statusText}</span></p>
        ${(o.status === 'approved' && o.download_token && new Date(o.token_expires_at) > new Date()) ? `<a href="/api/download?token=${o.download_token}" class="btn">📥 تحميل الكتاب</a>` : ''}
        ${(o.status === 'pending' && o.method === 'bank') ? `<button class="btn" onclick="openProofModal(${o.id})">📎 رفع إيصال</button>` : ''}
        ${(o.status === 'pending' && (o.method === 'trx' || o.method === 'usdt')) ? `<button class="btn" onclick="openResumeModal(${o.id}, '${o.method}', ${o.amount})">🔄 استكمال الدفع</button>` : ''}
      </div>
    `;
  }).join('');
}

function verifyResumePayment() { /* ... */ }

function toast(msg) { /* ... */ }
</script>
