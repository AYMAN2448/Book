<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلباتي - مكتبة سديم للكتب الإلكترونية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  .copy-container { display: flex; align-items: center; gap: 8px; background: #fff; padding: 8px 12px; border-radius: 8px; direction: ltr; margin: 10px 0; border: 1px solid #ddd; }
  .copy-address { flex: 1; font-family: monospace; font-size: 14px; cursor: pointer; user-select: all; }
  .copy-btn { background: #e94560; color: white; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  .toast-msg { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 16px; border-radius: 30px; z-index: 2000; }
  footer {
    text-align: center;
    padding: 20px;
    margin-top: 30px;
    border-top: 1px solid #ddd;
    color: #777;
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<header>
  <h2>مكتبة سديم للكتب الإلكترونية</h2>
  <nav>
    <a href="/">الرئيسية</a>
    <a href="/books.html">الكتب</a>
  </nav>
</header>
<div class="container">
  <h2>آخر 5 طلباتي</h2>
  <div id="ordersList"></div>
</div>

<!-- مودال رفع الإيصال للطلبات اليدوية -->
<div class="modal" id="proofModal">
  <div class="modal-content">
    <h3>رفع إثبات الدفع</h3>
    <input type="text" id="proofNumber" placeholder="رقم الإيصال / معرف التحويل">
    <button class="btn" onclick="submitProof()">إرسال</button>
    <button class="btn" style="background:#ccc; color:#333;" onclick="closeProofModal()">إلغاء</button>
  </div>
</div>

<!-- مودال استكمال الدفع للعملات الرقمية -->
<div class="modal" id="resumePaymentModal">
  <div class="modal-content">
    <h3>استكمال الدفع</h3>
    <div id="resumePaymentInfo"></div>
    <button class="btn" id="verifyResumeBtn" onclick="verifyResumePayment()">🔍 تحققت من الدفع</button>
    <button class="btn" style="background:#ccc; color:#333;" onclick="closeResumeModal()">إلغاء</button>
  </div>
</div>

<script src="/script.js"></script>
<script>
// ========== إعدادات العملات (يجب أن تتطابق مع القيم في index.html) ==========
const USD_TO_LOCAL = 4000;
const LOCAL_CURRENCY_NAME = "ج.س";
const USD_TO_TRX = 6.7;
const DISCOUNT_RATE = 0.5;  // خصم 50% للعملة المحلية

let currentOrderId = null;
let resumeOrderId = null;
let resumeMethod = null;
let resumeAmount = null;

loadOrders();

async function loadOrders() {
  const res = await api('/api/orders');
  if (!res.success) return;
  const orders = res.orders;
  const list = document.getElementById('ordersList');
  if (!orders.length) {
    list.innerHTML = '<p>لا توجد طلبات بعد</p>';
    return;
  }

  // عرض آخر 5 طلبات (الـ API جلبها مرتبة من الأحدث)
  list.innerHTML = orders.map(o => {
    // تحديد العملة والقيمة بناءً على طريقة الدفع
    let currencyValue = '';
    if (o.method === 'bank') {
      const originalLocal = o.amount * USD_TO_LOCAL;
      const discountedLocal = originalLocal * (1 - DISCOUNT_RATE);
      currencyValue = `${discountedLocal.toFixed(2)} ${LOCAL_CURRENCY_NAME} (بعد الخصم ${DISCOUNT_RATE*100}%)`;
    } else if (o.method === 'usdt') {
      currencyValue = `${o.amount} USDT`;
    } else if (o.method === 'trx') {
      const trxAmount = o.amount * USD_TO_TRX;
      currencyValue = `${trxAmount.toFixed(2)} TRX`;
    } else {
      currencyValue = `${o.amount} $`;
    }

    // ترجمة حالة الطلب
    let statusText = '';
    let statusClass = '';
    switch (o.status) {
      case 'pending':
        statusText = '⏳ قيد الانتظار (لم يتم الدفع بعد)';
        statusClass = 'pending';
        break;
      case 'pending_review':
        statusText = '🔍 جاري مراجعة الإيصال';
        statusClass = 'pending_review';
        break;
      case 'approved':
        statusText = '✅ تمت الموافقة ويمكنك التحميل';
        statusClass = 'approved';
        break;
      case 'rejected':
        statusText = '❌ مرفوض';
        statusClass = 'rejected';
        break;
      default:
        statusText = o.status;
    }

    return `
      <div class="card">
        <h3>📖 ${o.book_title || 'كتاب غير معروف'}</h3>
        <p>💰 المبلغ المطلوب: ${currencyValue}</p>
        <p>📌 الحالة: <span class="status ${statusClass}">${statusText}</span></p>
        ${o.status === 'approved' && o.download_token && o.token_expires_at && new Date(o.token_expires_at) > new Date() ? 
          `<a href="/api/download?token=${o.download_token}" target="_blank" class="btn">📥 تحميل الكتاب</a>` : 
          (o.status === 'approved' ? '<p>⚠️ رابط التحميل غير متاح حالياً (انتهت صلاحيته)</p>' : '')
        }
        ${(o.status === 'pending' && o.method === 'bank') ? `<button class="btn" onclick="openProofModal(${o.id})">📎 رفع إيصال الدفع</button>` : ''}
        ${(o.status === 'pending' && (o.method === 'trx' || o.method === 'usdt')) ? `<button class="btn" onclick="openResumeModal(${o.id}, '${o.method}', ${o.amount})">🔄 استكمال الدفع</button>` : ''}
      </div>
    `;
  }).join('');
}

// ========== دوال رفع الإيصال ==========
function openProofModal(id) {
  currentOrderId = id;
  document.getElementById('proofModal').classList.add('active');
}
function closeProofModal() {
  document.getElementById('proofModal').classList.remove('active');
}
async function submitProof() {
  const proof = document.getElementById('proofNumber').value.trim();
  if (!proof) return toast('أدخل رقم الإيصال');
  const res = await api('/api/submit-proof', 'POST', { orderId: currentOrderId, proof });
  if (res.success) {
    toast('تم رفع الإيصال، سيتم مراجعته من قبل الأدمن');
    closeProofModal();
    loadOrders();
  } else {
    toast('خطأ: ' + res.error);
  }
}

// ========== دوال استكمال الدفع للعملات الرقمية ==========
function openResumeModal(orderId, method, amount) {
  resumeOrderId = orderId;
  resumeMethod = method;
  resumeAmount = amount;
  const address = method === 'trx' ? 'TArc3MovymaBrNmR4e4iRidLFx15BbDQ5L' : '0x1b90069d9503e1931d30a8884080cdf16bd0cded';
  const infoDiv = document.getElementById('resumePaymentInfo');
  const displayAmount = method === 'trx' ? (amount * USD_TO_TRX).toFixed(2) + ' TRX' : amount + ' USDT';
  infoDiv.innerHTML = `
    <p><strong>✅ رقم الطلب:</strong> ${orderId}</p>
    <p>المبلغ المطلوب: <strong>${displayAmount}</strong></p>
    <p>أرسل المبلغ إلى العنوان التالي:</p>
    <div class="copy-container">
      <span class="copy-address" onclick="copyToClipboard('${address}')">${address}</span>
      <button class="copy-btn" onclick="copyToClipboard('${address}')">📋 نسخ</button>
    </div>
    <p>📌 <strong>هام:</strong> اكتب رقم الطلب <strong>${orderId}</strong> في المذكرة (Memo).</p>
    <p>بعد الإرسال اضغط "تحققت من الدفع" لإكمال الطلب تلقائياً.</p>
  `;
  document.getElementById('resumePaymentModal').classList.add('active');
}
function closeResumeModal() {
  document.getElementById('resumePaymentModal').classList.remove('active');
}
async function verifyResumePayment() {
  if (!resumeOrderId) return;
  toast('جاري التحقق من الدفع...');
  const expectedAmount = resumeMethod === 'trx' ? resumeAmount * USD_TO_TRX : resumeAmount;
  const res = await api('/api/verify-payment', 'POST', { orderId: resumeOrderId, method: resumeMethod, expectedAmount });
  if (res.success && res.approved) {
    toast('✅ تم تأكيد الدفع! يمكنك الآن تحميل الكتاب من هذه الصفحة');
    closeResumeModal();
    loadOrders();
  } else {
    toast('❌ لم يتم العثور على الدفع. تأكد من المبلغ والمذكرة.');
  }
}

// ========== دوال مساعدة ==========
function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => toast('✅ تم نسخ العنوان')).catch(() => toast('❌ فشل النسخ'));
}
function toast(msg) {
  let t = document.querySelector('.toast-msg');
  if (!t) {
    t = document.createElement('div');
    t.className = 'toast-msg';
    document.body.appendChild(t);
  }
  t.innerText = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}
</script>

<footer>
  Powered by Bemo technology
</footer>

</body>
</html>
