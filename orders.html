<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>طلباتي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h2>مكتبة الكتب</h2>
  <nav>
    <a href="/">الرئيسية</a>
    <a href="/books.html">الكتب</a>
  </nav>
</header>
<div class="container">
  <h2>طلباتي</h2>
  <div id="ordersList"></div>
</div>
<script src="/script.js"></script>
<script>
async function loadOrders() {
  const res = await api('/api/orders');
  if (!res.success) return;
  const orders = res.orders;
  const list = document.getElementById('ordersList');
  if (orders.length === 0) {
    list.innerHTML = '<p>لا توجد طلبات بعد</p>';
    return;
  }
  list.innerHTML = orders.map(o => `
    <div class="card">
      <h3>${o.book_title}</h3>
      <p>الطريقة: ${o.method} | المبلغ: ${o.amount} $</p>
      <p>الحالة: <span class="status ${o.status}">${statusText(o.status)}</span></p>
      ${o.status === 'approved' && o.file_url ? `<a href="${o.file_url}" target="_blank" class="btn">تحميل الكتاب</a>` : ''}
      ${o.status === 'pending' && o.method === 'bank' ? `<button class="btn" onclick="submitProofAgain(${o.id})">رفع إيصال الدفع</button>` : ''}
    </div>
  `).join('');
}

function statusText(status) {
  if (status === 'pending') return 'قيد الانتظار';
  if (status === 'pending_review') return 'جاري المراجعة';
  if (status === 'approved') return 'تمت الموافقة';
  if (status === 'rejected') return 'مرفوض';
  return status;
}

async function submitProofAgain(orderId) {
  const proof = prompt('أدخل رقم الإيصال / معرف التحويل:');
  if (!proof) return;
  const res = await api('/api/submit-proof', 'POST', { orderId, proof });
  if (res.success) {
    toast('تم رفع الإيصال، سيتم مراجعته');
    loadOrders();
  } else {
    toast('خطأ: ' + res.error);
  }
}

loadOrders();
</script>
</body>
</html>
